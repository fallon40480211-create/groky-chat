<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>groky chat</title>
  <meta name="description" content="groky chat —— 纯本地的 AI 聊天客户端">
  <meta name="theme-color" content="#faf6f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="groky chat">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="vendor/hl-light.css" id="hl-light">
  <link rel="stylesheet" href="vendor/hl-dark.css" id="hl-dark">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/marked.min.js" defer></script>
  <script src="vendor/purify.min.js" defer></script>
  <script src="vendor/highlight.min.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="对话列表">
      <div class="side-head">
        <div class="brand"><img src="icons/icon-192.png" alt=""><span>groky chat</span></div>
        <button id="btn-new-side" class="icon-btn" aria-label="新对话" data-icon="plus"></button>
      </div>
      <div class="side-search"><input id="conv-search" type="search" placeholder="搜索对话" autocomplete="off"></div>
      <nav id="conv-list"></nav>
      <div class="side-foot">
        <button class="side-link" data-open="providers"><span data-icon="plug"></span>模型服务</button>
        <button class="side-link" data-open="personas"><span data-icon="mask"></span>角色 / 人设</button>
        <button class="side-link" data-open="settings"><span data-icon="gear"></span>设置</button>
      </div>
    </aside>
    <div id="scrim"></div>
    <main id="main">
      <header id="topbar">
        <button id="btn-menu" class="icon-btn" aria-label="菜单" data-icon="menu"></button>
        <button id="btn-conv-settings" class="title-btn" aria-label="对话设置">
          <span id="conv-title">新对话</span>
          <span id="conv-model" class="chip">未选择模型</span>
        </button>
        <button id="btn-new" class="icon-btn" aria-label="新对话" data-icon="edit"></button>
      </header>
      <section id="messages" aria-live="polite"></section>
      <footer id="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="输入消息…" enterkeyhint="send"></textarea>
          <button id="btn-send" class="send-btn" aria-label="发送" data-icon="send"></button>
        </div>
      </footer>
    </main>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" role="status"></div>
</body>
</html>
